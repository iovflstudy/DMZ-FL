# Bulletproofs micro-benchmark (independent of the 100-round accuracy run)
backend:
  real: "dalek-cryptography Rust bulletproofs v5 (cargo run --release in experiments/zkp_bulletproofs)"
  mock: "fixed measured constants on Windows for development"
curve: "Ristretto / curve25519-dalek v4"
statement: "32-bit range proof over the quantized norm slack n"
sweep:
  aggregated_scalars_m: [1, 8, 32, 70]          # one proof over m scalars
  independent_proofs_N: [1, 10, 50, 70, 100, 200, 500, 1000]  # one proof/vehicle
report:
  per_proof_m1: "19.1 ms prove / 2.71 ms verify / 608 B"
  verify_per_round_ms: 190      # 70 independent proofs x 2.71 ms
  verify_1000_clients_ms: 2300  # ~2.71 N ms, linear; embarrassingly parallel across RSUs
  share_of_per_round_latency: "<7% of the 3,229 ms per-round FL latency"
