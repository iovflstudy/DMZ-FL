# DMZ-FL Hyperparameters  (aligned with the JSA revised manuscript)
# ====================================================================

fl:
  num_clients: 100          # N
  selected_per_round: 70     # N_s
  num_rounds: 100
  local_epochs: 5
  batch_size: 64
  learning_rate: 0.01
  proximal_mu: 0.005        # lighter than FedProx (0.01)

datasets:
  fashion_mnist:
    model: CNN2
    norm_bound_B: 15.0
    input_size: [28, 28]
    num_classes: 10
  veremi:
    model: MLP3
    norm_bound_B: 5.0
    num_classes: 5
  car_hacking:
    model: MLP3
    norm_bound_B: 5.0
    num_classes: 4

norm_slack:                 # 32-bit fixed-point encoding of B^2 - ||g||^2
  slack_bits: 32            # n = floor((B^2 - ||g||^2) * 2^32 / B^2) in [0, 2^32)

bulletproofs:
  # 32-bit range proof over the quantized norm slack; neither n nor any
  # gradient component is revealed. The on-chain commitment is the scalar
  # Pedersen C_n = Commit(n, r_n); g/w_local stay on the encrypted off-channel.
  statement: "32-bit range proof over quantized norm slack n"
  commitment: "scalar Pedersen C_n = Commit(n, r_n), perfectly hiding"
  norm_bound: "model-adaptive (CNN2=15, MLP3=5)"
  curve: "Ristretto / curve25519-dalek v4"
  library: "dalek-cryptography Rust bulletproofs v5 (experiments/zkp_bulletproofs), thin native interface"
  trusted_setup: false
  proof_aggregation: "m=1 deployed; m-sweep reported in the micro-benchmark table"
  measured:
    prove_ms_per_proof: 19.1
    verify_ms_per_proof: 2.71
    proof_bytes: 608
  transaction_bytes:
    commitment: 32
    proof: 608
    metadata: 92
    total: 732               # w_local and r_n are OFF-chain, not included

dag:
  mcmc_walk_steps: 10        # L
  mcmc_bias: 0.5             # beta
  mcmc_tips: 2               # k
  optimistic_depth: 10       # K  -> forgery prob ~8.4e-4 at p_h=0.67
  final_depth: 60             # K_final -> forgery prob ~3.4e-19
  honest_prop: 0.67          # p_h
  byzantine_prop: 0.33       # alpha
  aggregation_window: 6       # T_w rounds
  output_interval: 5          # metrics reported per 5 rounds (NOT per 1 round)

mappo:
  architecture: CTDE
  actor: [128, 64]
  critic: [256, 128]
  ppo_clip: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.015
  grad_clip: 10.0
  rollout_buffer: 4096
  update_every_rounds: 10
  no_improve_patience: 5
  reward_norm_target: 0.3333  # exp(-3*| ||g||/B - 1/3 |), scale-invariant

reputation:
  initial: 0.5
  warmup_rounds: 5           # reward-only during warmup
  ema_decay: 0.95             # gamma
  reward_delta: 0.03          # delta+ on passing
  penalty_delta: -0.03        # delta- on failing
  rollback_penalty: -0.10     # extra penalty on rollback (added to the -0.03 failure penalty; total delta_roll = -0.13)
  clamp: [0.0, 1.0]
  epsilon_greedy: 0.2         # exploration after rollback
  cosine_threshold: -0.3      # angle > 107.5 deg, directional poisoning detection

pbft:
  rsu_count: 7               # M
  byzantine_tolerance: "f_R < M/3"
  master_election_rounds: 20
  message_complexity: "O(M^2) = 49 msgs/block"
  vote_timeout_ms: 500

attacks:
  sign_flip: "g -> -g"          # direction attack: cosine + reputation + rollback
  gradient_scaling: "g -> 10g"  # amplitude attack: rejected by Bulletproofs norm bound
  label_flipping: "y -> (y + floor(C/2)) mod C"
  malicious_ratios: [0.0, 0.10, 0.20, 0.30]

reproducibility:
  seeds: [42, 142, 242]
  runs_per_config: 3
  hardware: "2x RTX 4090D, 56GB RAM, Ubuntu 22.04, PyTorch 2.2.1"
